.msg.ok { background: #eef7ee; border: 1px solid #9fc79f; }
.accuse { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.closing { font-family: var(--mono); font-size: 12px; margin-top: 8px; white-space: pre-line; }

/* Cuadros de diálogo */
.dlg .body { display: flex; gap: 12px; padding: 14px 14px 8px; align-items: flex-start; max-width: 360px; }
.dlg .body .ico { width: 32px; height: 32px; }
.dlg .body p { margin: 0; line-height: 1.45; }
.dlg .foot { display: flex; justify-content: center; gap: 6px; padding: 6px 14px 12px; }
.dlg .foot .btn { min-width: 76px; justify-content: center; }

/* Pantallas estrechas: todas las ventanas maximizadas */
@media (max-width: 760px) {
  .win:not(.dlg) { left: 0 !important; top: 0 !important; width: 100% !important; height: 100% !important; }
  .win.dlg { left: 50% !important; top: 30% !important; transform: translateX(-50%); width: min(340px, calc(100vw - 20px)) !important; }
  .win .tb button[data-a="max"] { display: none; }
  .win .rz { display: none; }
  .gmain { grid-template-columns: minmax(0, 1fr); }
  .glist .items { max-height: 120px; }
  .grid-form { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .f.w2 { grid-column: 1 / -1; }
  .totals { grid-template-columns: minmax(0, 1fr); }
  .totals .box { min-width: 0; }
  .mail { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .mfolders { display: flex; overflow-x: auto; }
  .mfolders button { width: auto; white-space: nowrap; }
  .mlist td.d, .mlist th.d { display: none; }
  .mdk { padding: 10px; }
  .mdk > div:first-child, .mdk .side { flex: 1 1 100%; }
  .board { max-width: 420px; }
  .task { flex-basis: 40px; }
  .task span:last-child { display: none; }
  .icons { grid-auto-flow: row; grid-template-columns: repeat(auto-fill, 84px); grid-template-rows: none; grid-auto-rows: 84px; justify-content: start; }
}

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const eur = new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR" });
  const num = (v) => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : 0; };
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const narrow = () => window.matchMedia("(max-width: 760px)").matches;
  const coarse = () => window.matchMedia("(pointer: coarse)").matches;

  /* ---------------- Iconos ---------------- */
  const I = {
    pc: '<svg viewBox="0 0 32 32"><rect x="4" y="3" width="24" height="18" fill="#c0c0c0" stroke="#000"/><rect x="7" y="6" width="18" height="12" fill="#008080" stroke="#404040"/><rect x="10" y="22" width="12" height="3" fill="#c0c0c0" stroke="#000"/><rect x="5" y="25" width="22" height="4" fill="#c0c0c0" stroke="#000"/></svg>',
    folder: '<svg viewBox="0 0 32 32"><path d="M2 8h10l3 3h15v17H2z" fill="#f5d76e" stroke="#7a5c00"/><path d="M2 13h28" stroke="#c9a227"/></svg>',
    docs: '<svg viewBox="0 0 32 32"><path d="M2 8h10l3 3h15v17H2z" fill="#f5d76e" stroke="#7a5c00"/><rect x="9" y="13" width="14" height="12" fill="#fff" stroke="#000"/><path d="M11 17h10M11 20h10M11 23h6" stroke="#000080"/></svg>',
    txt: '<svg viewBox="0 0 32 32"><path d="M7 2h13l5 5v23H7z" fill="#fff" stroke="#000"/><path d="M20 2v5h5" fill="none" stroke="#000"/><path d="M10 11h12M10 15h12M10 19h12M10 23h8" stroke="#000080"/></svg>',
    fac: '<svg viewBox="0 0 32 32"><path d="M7 2h13l5 5v23H7z" fill="#fff" stroke="#000"/><path d="M20 2v5h5" fill="none" stroke="#000"/><rect x="9" y="10" width="14" height="3" fill="#000080"/><path d="M10 17h7M10 20h7M10 23h7" stroke="#808080"/><path d="M19 17h3M19 20h3M19 23h3" stroke="#000"/><path d="M18 26h5" stroke="#b00000" stroke-width="1.5"/></svg>',
    mail: '<svg viewBox="0 0 32 32"><rect x="3" y="8" width="26" height="17" fill="#fff" stroke="#000"/><path d="M3 8l13 10L29 8" fill="none" stroke="#000"/><path d="M3 25l10-8M29 25l-10-8" stroke="#808080"/></svg>',
    mailnew: '<svg viewBox="0 0 32 32"><rect x="3" y="8" width="26" height="17" fill="#fff" stroke="#000"/><path d="M3 8l13 10L29 8" fill="none" stroke="#000"/><circle cx="26" cy="8" r="5.5" fill="#c00" stroke="#600"/><path d="M26 5v4M26 10.5v.5" stroke="#fff" stroke-width="1.6"/></svg>',
    web: '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="#5aa0e6" stroke="#003a80"/><path d="M8 11c3 1 4 4 7 3s2 5 5 4 3 4 1 6M19 6c-1 3 2 4 4 3" fill="none" stroke="#2c7a2c" stroke-width="2.4" stroke-linecap="round"/><path d="M4 16h24M16 4c-5 5-5 19 0 24M16 4c5 5 5 19 0 24" fill="none" stroke="#003a80" stroke-opacity=".5"/></svg>',
    notepad: '<svg viewBox="0 0 32 32"><rect x="6" y="4" width="20" height="25" fill="#fff" stroke="#000"/><rect x="6" y="4" width="20" height="4" fill="#5aa0e6" stroke="#000"/><path d="M9 12h14M9 16h14M9 20h14M9 24h9" stroke="#808080"/><path d="M10 2v4M16 2v4M22 2v4" stroke="#000" stroke-width="1.5"/></svg>',
    bin: '<svg viewBox="0 0 32 32"><path d="M8 9h16l-2 20H10z" fill="#e8e8e8" stroke="#000"/><path d="M6 7h20v3H6z" fill="#c0c0c0" stroke="#000"/><path d="M13 13v12M16 13v12M19 13v12" stroke="#808080"/><path d="M11 17l4-2 1 4" fill="none" stroke="#2c7a2c" stroke-width="1.5"/></svg>',
    binfull: '<svg viewBox="0 0 32 32"><path d="M8 9h16l-2 20H10z" fill="#e8e8e8" stroke="#000"/><path d="M10 4l6 3 5-3 3 4H8z" fill="#fff" stroke="#000"/><path d="M6 7h20v3H6z" fill="#c0c0c0" stroke="#000"/><path d="M13 13v12M16 13v12M19 13v12" stroke="#808080"/></svg>',
    gesta: '<svg viewBox="0 0 32 32"><rect x="4" y="4" width="24" height="24" fill="#2b5aa6" stroke="#000"/><rect x="7" y="8" width="18" height="17" fill="#fff" stroke="#000"/><path d="M9 12h14M9 15h14M9 18h14M9 21h14" stroke="#9fb4d8"/><path d="M18 10v14" stroke="#9fb4d8"/><text x="16" y="7.2" font-size="4.5" text-anchor="middle" fill="#fff" font-family="Tahoma,sans-serif" font-weight="bold">2000</text></svg>',
    drive: '<svg viewBox="0 0 32 32"><rect x="3" y="11" width="26" height="12" fill="#c0c0c0" stroke="#000"/><path d="M3 17h26" stroke="#808080"/><rect x="22" y="19" width="4" height="2" fill="#2c7a2c"/></svg>',
    floppy: '<svg viewBox="0 0 32 32"><rect x="5" y="4" width="22" height="24" fill="#404060" stroke="#000"/><rect x="9" y="4" width="13" height="8" fill="#c0c0c0" stroke="#000"/><rect x="17" y="5" width="3" height="6" fill="#404060"/><rect x="8" y="16" width="16" height="12" fill="#fff" stroke="#000"/></svg>',
    info: '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="#fff" stroke="#000080" stroke-width="2"/><circle cx="16" cy="9.5" r="2" fill="#000080"/><path d="M16 14v10" stroke="#000080" stroke-width="3.5"/></svg>',
    warn: '<svg viewBox="0 0 32 32"><path d="M16 3l14 25H2z" fill="#ffd200" stroke="#000"/><path d="M16 11v9" stroke="#000" stroke-width="3"/><circle cx="16" cy="24" r="1.8"/></svg>',
    error: '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="#d00" stroke="#600"/><path d="M10 10l12 12M22 10L10 22" stroke="#fff" stroke-width="3.5"/></svg>',
    shut: '<svg viewBox="0 0 32 32"><rect x="4" y="5" width="24" height="16" fill="#c0c0c0" stroke="#000"/><rect x="7" y="8" width="18" height="10" fill="#000"/><path d="M12 25h8M16 21v4" stroke="#000" stroke-width="2"/><circle cx="16" cy="13" r="3" fill="none" stroke="#c00" stroke-width="1.5"/></svg>',
    start: '<svg viewBox="0 0 32 32"><rect x="4" y="4" width="11" height="11" fill="#d33" /><rect x="17" y="4" width="11" height="11" fill="#2a2"/><rect x="4" y="17" width="11" height="11" fill="#25c"/><rect x="17" y="17" width="11" height="11" fill="#eb0"/></svg>'
  };
  const ico = (name, size) => `<span class="ico" style="width:${size}px;height:${size}px">${I[name]}</span>`;

  /* ---------------- Gestor de ventanas ---------------- */
  const WM = { wins: new Map(), z: 100, active: null, count: 0 };

  /* El equipo tarda en hacer caso: cada acción pesada pone el reloj de arena, ignora los clics y se ejecuta al rato. */
  let busyN = 0;
  const rnd = (a, b) => a + Math.random() * (b - a);
  function busy(ms, fn) {
    busyN++; document.documentElement.classList.add("busy");
    setTimeout(() => { busyN--; if (!busyN) document.documentElement.classList.remove("busy"); if (fn) fn(); }, ms);
  }
  function openWin(key, def, arg) {
    const w = WM.wins.get(key);
    if (w) { w.el.hidden = false; w.min = false; focusWin(w); if (def.update) def.update(w, arg); renderTasks(); return; }
    busy(def.dialog ? rnd(150, 350) : rnd(600, 1500), () => { if (!WM.wins.get(key)) openWinNow(key, def, arg); });
  }
  function openWinNow(key, def, arg) {
    let w;
    const el = document.createElement("div");
    el.className = "win out" + (def.dialog ? " dlg" : "");
    el.setAttribute("role", def.dialog ? "alertdialog" : "dialog");
    el.innerHTML = `<div class="tb"><span class="ico"></span><span class="tt"></span>
      ${def.dialog ? "" : '<button class="out" data-a="min" aria-label="Minimizar">_</button><button class="out" data-a="max" aria-label="Maximizar">□</button>'}
      <button class="out" data-a="close" aria-label="Cerrar">✕</button></div><div class="wb"></div>`;
    w = { key, def, el, body: el.querySelector(".wb"), min: false, max: false, title: "", icon: def.icon };
    WM.wins.set(key, w);
    setTitle(w, def.title, def.icon);
    const dw = $("layer").clientWidth, dh = $("layer").clientHeight;
    const ww = Math.min(def.w || 520, dw - 8), hh = Math.min(def.h || 380, dh - 8);
    el.style.width = ww + "px"; el.style.height = def.autoH ? "auto" : hh + "px";
    const off = (WM.count++ % 6) * 24;
    el.style.left = (def.center ? Math.max(4, (dw - ww) / 2) : Math.min(60 + off, Math.max(4, dw - ww - 4))) + "px";
    el.style.top = (def.center ? Math.max(4, dh * 0.28 - 60) : Math.min(16 + off, Math.max(4, dh - hh - 4))) + "px";
    if (def.max) { w.max = true; el.classList.add("max"); }
    el.addEventListener("pointerdown", () => focusWin(w), true);
    el.querySelectorAll(".tb button").forEach((b) => b.addEventListener("click", (e) => {
      e.stopPropagation();
      const a = b.dataset.a;
      if (a === "close") closeWin(w);
      if (a === "min") { w.min = true; el.hidden = true; if (WM.active === w) WM.active = null; renderTasks(); }
      if (a === "max") { w.max = !w.max; el.classList.toggle("max", w.max); }
    }));
    el.querySelector(".tb").addEventListener("dblclick", (e) => { if (!def.dialog && !e.target.closest("button")) { w.max = !w.max; el.classList.toggle("max", w.max); } });
    dragify(w);
    if (!def.dialog) resizable(w);
    $("layer").appendChild(el);
    def.create(w, arg);
    focusWin(w);
    renderTasks();
    return w;
  }
  function setTitle(w, title, icon) {
    w.title = title; if (icon) w.icon = icon;
    w.el.querySelector(".tt").textContent = title;
    w.el.querySelector(".tb .ico").innerHTML = I[w.icon];
    w.el.setAttribute("aria-label", title);
    renderTasks();
  }
  function focusWin(w) {
    WM.wins.forEach((o) => o.el.classList.remove("active"));
    w.el.classList.add("active"); w.el.style.zIndex = ++WM.z; WM.active = w;
    renderTasks();
  }
  function closeWin(w) {
    if (w.def.onClose) w.def.onClose(w);
    w.el.remove(); WM.wins.delete(w.key);
    if (WM.active === w) WM.active = null;
    const top = [...WM.wins.values()].filter((o) => !o.min).sort((a, b) => b.el.style.zIndex - a.el.style.zIndex)[0];
    if (top) focusWin(top); else renderTasks();
  }
  function dragify(w) {
    const tb = w.el.querySelector(".tb");
    let sx, sy, ox, oy, id = null;
    tb.addEventListener("pointerdown", (e) => {
      if (e.target.closest("button") || w.max || narrow()) return;
      id = e.pointerId; tb.setPointerCapture(id);
      sx = e.clientX; sy = e.clientY; ox = w.el.offsetLeft; oy = w.el.offsetTop;
    });
    tb.addEventListener("pointermove", (e) => {
      if (e.pointerId !== id) return;
      const dw = $("layer").clientWidth, dh = $("layer").clientHeight;
      w.el.style.left = Math.min(Math.max(ox + e.clientX - sx, 40 - w.el.offsetWidth), dw - 40) + "px";
      w.el.style.top = Math.min(Math.max(oy + e.clientY - sy, 0), dh - 24) + "px";
    });
    const end = (e) => { if (e.pointerId === id) id = null; };
    tb.addEventListener("pointerup", end); tb.addEventListener("pointercancel", end);
  }
  /* Redimensionar arrastrando los bordes o las esquinas (no en ventanas maximizadas ni en pantallas estrechas). */
  const MIN_W = 240, MIN_H = 150;
  function resizable(w) {
    ["n", "s", "e", "w", "nw", "ne", "sw", "se"].forEach((d) => {
      const h = document.createElement("div");
      h.className = "rz rz-" + d; h.setAttribute("aria-hidden", "true");
      w.el.appendChild(h);
      let st = null;
      h.addEventListener("pointerdown", (e) => {
        if (w.max || narrow() || e.button > 0) return;
        e.preventDefault(); e.stopPropagation();
        h.setPointerCapture(e.pointerId);
        st = { id: e.pointerId, x: e.clientX, y: e.clientY, l: w.el.offsetLeft, t: w.el.offsetTop, wd: w.el.offsetWidth, ht: w.el.offsetHeight };
        w.el.classList.add("resizing"); focusWin(w);
      });
      h.addEventListener("pointermove", (e) => {
        if (!st || e.pointerId !== st.id) return;
        const L = $("layer"), maxW = L.clientWidth, maxH = L.clientHeight;
        const dx = e.clientX - st.x, dy = e.clientY - st.y;
        let l = st.l, t = st.t, wd = st.wd, ht = st.ht;
        if (d.includes("e")) wd = Math.min(Math.max(MIN_W, st.wd + dx), maxW - l);
        if (d.includes("s")) ht = Math.min(Math.max(MIN_H, st.ht + dy), maxH - t);
        if (d.includes("w")) { wd = Math.min(Math.max(MIN_W, st.wd - dx), st.l + st.wd); l = st.l + st.wd - wd; }
        if (d.includes("n")) { ht = Math.min(Math.max(MIN_H, st.ht - dy), st.t + st.ht); t = st.t + st.ht - ht; }
        Object.assign(w.el.style, { left: l + "px", top: t + "px", width: wd + "px", height: ht + "px" });
      });
      const end = (e) => { if (st && e.pointerId === st.id) { st = null; w.el.classList.remove("resizing"); } };
      h.addEventListener("pointerup", end); h.addEventListener("pointercancel", end);
    });
  }

  function renderTasks() {
    const box = $("tasks"); box.innerHTML = "";
    WM.wins.forEach((w) => {
      if (w.def.dialog) return;
      const b = document.createElement("button");
      b.className = "btn out task" + (WM.active === w && !w.min ? " pressed" : "");
      b.innerHTML = `<span class="ico">${I[w.icon]}</span><span></span>`;
      b.lastChild.textContent = w.title; b.title = w.title;
      b.onclick = () => {
        if (WM.active === w && !w.min) { w.min = true; w.el.hidden = true; WM.active = null; renderTasks(); }
        else { w.min = false; w.el.hidden = false; focusWin(w); }
      };
      box.appendChild(b);
    });
  }

  /* Cuadro de mensaje */
  let dlgN = 0;
  function msgbox(title, text, icon) {
    openWin("dlg" + (dlgN++), {
      title, icon: icon === "error" ? "error" : icon === "warn" ? "warn" : "info", dialog: true, w: 340, autoH: true, center: true,
      create(w) {
        w.body.innerHTML = `<div class="body">${ico(icon || "info", 32)}<p></p></div><div class="foot"><button class="btn out">Aceptar</button></div>`;
        w.body.querySelector("p").textContent = text;
        const ok = w.body.querySelector(".foot button"); ok.onclick = () => closeWin(w); setTimeout(() => ok.focus(), 0);
      }
    });
  }

  /* ---------------- Facturas ---------------- */
  const EJEMPLO = [
    { serie: "A", num: "0139", fecha: "2026-10-02", pago: "Transferencia 30 días", cliente: "Pembroke, Agatha", nif: "16583204K", cp: "26001 Logroño", dir: "C/ Portales, 14, 2º izda.", obs: "",
      lineas: [{ cod: "AS-01", con: "Asesoría fiscal trimestral", cant: 1, precio: 120, dto: 0, iva: 21 }, { cod: "PR-03", con: "Presentación modelo 303", cant: 1, precio: 35, dto: 0, iva: 21 }] },
    { serie: "A", num: "0140", fecha: "2026-10-09", pago: "Recibo domiciliado", cliente: "Thorne, Bernard", nif: "72981145M", cp: "26002 Logroño", dir: "Av. de la Paz, 3, bajo", obs: "",
      lineas: [{ cod: "NO-02", con: "Nóminas octubre (3 trabajadores)", cant: 3, precio: 18, dto: 0, iva: 21 }, { cod: "AS-04", con: "Alta en Seguridad Social", cant: 1, precio: 40, dto: 10, iva: 21 }] },
    { serie: "A", num: "0141", fecha: "2026-10-17", pago: "Contado", cliente: "Ashcombe, Reginald", nif: "16490377T", cp: "26006 Logroño", dir: "C/ del Lindero, 1", obs: "Sin respuesta del cliente.",
      lineas: [{ cod: "TE-01", con: "Gestión de testamento", cant: 1, precio: 210, dto: 0, iva: 21 }, { cod: "CO-07", con: "Copias compulsadas", cant: 12, precio: 1.5, dto: 0, iva: 21 }] }
  ];
  let invoices = store.get("ow.facturas") || JSON.parse(JSON.stringify(EJEMPLO));
  let cur = invoices.length - 1;
  const lineTotal = (l) => num(l.cant) * num(l.precio) * (1 - num(l.dto) / 100);
  const invTotal = (f) => f.lineas.reduce((s, l) => s + lineTotal(l) * (1 + num(l.iva) / 100), 0);
  const invFile = (f) => `${f.serie || "A"}-${f.num || "0000"} ${(f.cliente || "Sin cliente").split(",")[0]}.fac`;
  function saveInvoices() { store.set("ow.facturas", invoices); refreshExplorers(); }

  const GESTA = {
    title: "GESTA 2000 · Facturación", icon: "gesta", w: 860, h: 560,
    create(w, arg) {
      if (typeof arg === "number") cur = arg;
      w.body.innerHTML = `
      <div class="menubar"><button>Archivo</button><button>Edición</button><button>Facturas</button><button>Clientes</button><button>Ayuda</button></div>
      <div class="toolbar">
        <button class="btn out" data-g="nueva">${ico("fac", 16)}Nueva</button>
        <button class="btn out" data-g="guardar" style="font-weight:bold">${ico("floppy", 16)}Guardar</button>
        <span class="vsep"></span>
        <button class="btn out" data-g="linea">Añadir línea</button>
        <button class="btn out" data-g="duplicar">Duplicar</button>
      </div>
      <div class="gesta"><div class="gmain">
        <aside class="glist in"><div class="panel-title">Facturas emitidas</div><div class="items" id="gList" role="listbox" aria-label="Facturas"></div></aside>
        <section class="gdoc">
          <fieldset><legend>Cabecera</legend><div class="grid-form">
            <div class="f"><label for="gSerie">Serie</label><input class="in" id="gSerie"></div>
            <div class="f"><label for="gNum">Número</label><input class="in" id="gNum" inputmode="numeric"></div>
            <div class="f"><label for="gFecha">Fecha</label><input class="in" id="gFecha" type="date"></div>
            <div class="f"><label for="gPago">Forma de pago</label><select class="in" id="gPago"><option>Transferencia 30 días</option><option>Contado</option><option>Recibo domiciliado</option><option>Pagaré 60 días</option></select></div>

      const li = document.createElement("li"); li.className = "clue"; li.tabIndex = 0;
      const s = document.createElement("span"); s.textContent = cl.t; li.appendChild(s);
      li.onclick = () => li.classList.toggle("done");
      li.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); li.click(); } };
      ol.appendChild(li);
    });
    q(st, ".legend").innerHTML = Object.keys(OBJ_NAME).map((o) => `<span>${OI[o]}${OBJ_NAME[o]}</span>`).join("");
  }
  function clueHolds(st, cl) {
    const p = st.pos[cl.p], cs = st.cs; if (!p) return null;
    if (cl.k === "on") return cs.objs[p[0]][p[1]] === cl.o;
    if (cl.k === "adj") return adjObj(cs.objs, p[0], p[1], cl.o);
    if (cl.k === "room") return cs.rooms[p[0]][p[1]] === cl.o;
    return true;
  }
  function clearResult(st) { q(st, ".result").innerHTML = ""; st.el.querySelectorAll(".clue.bad").forEach((n) => n.classList.remove("bad")); }
  function showMsg(st, kind, text) { const r = q(st, ".result"); r.innerHTML = ""; const d = document.createElement("div"); d.className = "msg " + kind; d.textContent = text; r.appendChild(d); return d; }
  function check(st, i) {
    if (st.solved) return;
    clearResult(st);
    const cs = st.cs, missing = cs.cast.filter((p) => !st.pos[p]), problems = [], rows = {}, cols = {};
    Object.values(st.pos).forEach(([r, c]) => { rows[r] = (rows[r] || 0) + 1; cols[c] = (cols[c] || 0) + 1; });
    if (Object.values(rows).some((n) => n > 1)) problems.push("hay dos personas en la misma fila");
    if (Object.values(cols).some((n) => n > 1)) problems.push("hay dos personas en la misma columna");
    const bad = [], lis = st.el.querySelectorAll(".clue");
    cs.clues.forEach((cl, k) => { if (clueHolds(st, cl) === false) { bad.push(k + 1); lis[k].classList.add("bad"); } });
    if (bad.length) problems.push((bad.length === 1 ? "no se cumple la pista " : "no se cumplen las pistas ") + bad.join(", "));
    if (problems.length) return showMsg(st, "err", "Algo no cuadra: " + problems.join("; ") + ".");
    if (missing.length) return showMsg(st, "err", "De momento todo cuadra, pero faltan por colocar: " + missing.map((p) => PNAME[p]).join(", ") + ".");
    if (!Object.keys(cs.solution).every((p) => st.pos[p][0] === cs.solution[p][0] && st.pos[p][1] === cs.solution[p][1])) return showMsg(st, "err", "Las pistas se cumplen, pero esta no es la solución. Revisa las reglas.");
    askCulprit(st, i);
  }
  function askCulprit(st, i) {
    const d = showMsg(st, "ok", `Todos en su sitio. ¿Quién mató a ${PNAME[st.cs.victim]}?`), box = document.createElement("div"); box.className = "accuse";
    st.cs.cast.filter((p) => p !== st.cs.victim).forEach((p) => { const b = document.createElement("button"); b.className = "btn out"; b.textContent = PNAME[p]; b.onclick = () => accuse(st, i, p); box.appendChild(b); });
    d.appendChild(box);
  }
  function accuse(st, i, id) {
    const cs = st.cs, v = PNAME[cs.victim];
    if (id !== cs.murderer) {
      const d = showMsg(st, "err", `No. Fíjate en quién estaba en la misma habitación que ${v}.`), a = document.createElement("div"); a.className = "accuse";
      const b = document.createElement("button"); b.className = "btn out"; b.textContent = "Volver a acusar"; b.onclick = () => askCulprit(st, i); a.appendChild(b); d.appendChild(a); return;
    }
    st.solved = true;
    const [r, c] = cs.solution[cs.victim];
    const d = showMsg(st, "ok", `Correcto: fue ${PNAME[cs.murderer]}. Estaba a solas con ${v} ${cs.roomDef[cs.rooms[r][c]][2]}.`), x = document.createElement("div");
    x.className = "closing";
    x.textContent = `EXPEDIENTE ${cs.no} · CERRADO\nVíctima: ${PFULL[cs.victim] || v}\n${cs.record}\n` + (i + 1 < CASES.length ? `Caso nº ${CASES[i + 1].no}: disponible` : "Caso nº 0004: en preparación");
    d.appendChild(x);
    caseSolved(i);
  }
  function resetCase(st) { st.pos = {}; st.marks = {}; st.selected = st.cs.victim; st.solved = false; clearResult(st); st.el.querySelectorAll(".clue").forEach((n) => n.classList.remove("done")); setMode(st, "place"); renderBoard(st); }

  /* ---------------- Escritorio, menú Inicio, bandeja ---------------- */
  const DESK = [
    { name: "Mi PC", icon: "pc", go: "pc" },
    { name: "Mis documentos", icon: "docs", go: "docs" },
    { name: "Facturas", icon: "folder", go: "fac" },
    { name: "GESTA 2000", icon: "gesta", act: () => openWin("gesta", GESTA) },
    { name: "Correo", icon: "mail", act: () => openMail() },
    { name: "Navegador", icon: "web", act: () => openWeb("about:inicio") },
    { name: "Bloc de notas", icon: "notepad", act: () => openNote(null) },
    { name: "Papelera de reciclaje", icon: "binfull", go: "bin" }
  ];
  const dbox = $("dicons");
  DESK.forEach((it) => dbox.appendChild(iconButton(it, () => openItem(it), (el) => { dbox.querySelectorAll(".sel").forEach((x) => x.classList.remove("sel")); el.classList.add("sel"); })));
  $("desktop").addEventListener("pointerdown", (e) => { if (e.target === $("desktop") || e.target === dbox) dbox.querySelectorAll(".sel").forEach((x) => x.classList.remove("sel")); });

  const START = [
    { name: "GESTA 2000", icon: "gesta", act: () => openWin("gesta", GESTA) },
    { name: "Correo", icon: "mail", act: () => openMail() },
    { name: "Navegador", icon: "web", act: () => openWeb("about:inicio") },
    { name: "Bloc de notas", icon: "notepad", act: () => openNote(null) },
    { name: "Mis documentos", icon: "docs", act: () => openExplorer("docs") },
    { sep: true },
    { name: "Configuración", icon: "pc", disabled: true },
    { name: "Buscar", icon: "folder", disabled: true },
    { name: "Ayuda", icon: "info", act: () => msgbox("Ayuda", "Para obtener ayuda, consulte con el departamento de informática. Extensión 0.", "info") },
    { sep: true },
    { name: "Apagar el sistema...", icon: "shut", act: () => msgbox("Apagar el sistema", "No se puede apagar el equipo en este momento. Todavía tiene tareas pendientes.", "warn") }
  ];
  const sl = $("startlist");
  START.forEach((it) => {
    const li = document.createElement("li");
    if (it.sep) { li.innerHTML = "<hr>"; }
    else {
      const b = document.createElement("button"); b.innerHTML = `${ico(it.icon, 24)}<span></span>`; b.lastChild.textContent = it.name;
      if (it.disabled) b.disabled = true; else b.onclick = () => { toggleStart(false); it.act(); };
      li.appendChild(b);
    }
    sl.appendChild(li);
  });
  function toggleStart(show) {
    const m = $("startmenu"); show = show === undefined ? m.hidden : show;
    m.hidden = !show; m.style.zIndex = 9500; $("startBtn").classList.toggle("pressed", show); $("startBtn").setAttribute("aria-expanded", show);
    if (show) { const f = m.querySelector("button:not([disabled])"); if (f) f.focus(); }
  }
  $("startBtn").onclick = (e) => { e.stopPropagation(); if (!$("startmenu").hidden) toggleStart(false); else busy(rnd(200, 500), () => toggleStart(true)); };
  document.addEventListener("pointerdown", (e) => { if (!e.target.closest("#startmenu") && !e.target.closest("#startBtn")) toggleStart(false); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") toggleStart(false); });

  $("startIco").innerHTML = I.start; $("balloonIco").innerHTML = I.mailnew; $("trayMailIco").innerHTML = I.mailnew;
  const openNew = () => { $("balloon").hidden = true; openMail(MAIL.lastId); };
  $("balloon").onclick = (e) => { if (e.target.closest("#balloonX")) return; openNew(); };
  $("balloon").onkeydown = (e) => { if (e.key === "Enter") openNew(); };
  $("balloonX").onclick = (e) => { e.stopPropagation(); $("balloon").hidden = true; };
  $("trayMail").onclick = () => { $("balloon").hidden = true; openMail(MAIL.lastId); };
  function tick() { $("clock").textContent = new Date().toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" }); }
  tick(); setInterval(tick, 20000);

  /* Arranque: en pantallas grandes, GESTA abierto como si el contable estuviera trabajando. */
  if (!narrow()) openWin("gesta", GESTA);
})();
</script>
